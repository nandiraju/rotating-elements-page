<!DOCTYPE html>
<html lang="en-GB" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Srikanandiraju — Gallery</title>
  <meta name="description" content="Srikanandiraju — 3D curved museum walkway gallery in pure HTML and CSS." />
  <meta name="keywords" content="Srikanandiraju, gallery, 3D CSS animation, museum corridor, portfolio" />
  <meta name="author" content="Srikanth Nandiraju" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Srikanandiraju" />
  <meta property="og:title" content="Srikanandiraju — Gallery" />
  <meta property="og:description" content="Srikanandiraju — 3D curved museum walkway gallery in pure HTML and CSS." />
  <meta property="og:image" content="images/01-cancer-types.png" />
  <meta property="og:locale" content="en_GB" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Srikanandiraju — Gallery" />
  <meta name="twitter:description" content="Srikanandiraju — 3D curved museum walkway gallery in pure HTML and CSS." />
  <meta name="twitter:image" content="images/01-cancer-types.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f2f0;
      --wall: #eeeeec;
      --wall-spot: #ffffff;
      --floor-inner: #e2e2e0;
      --floor-mid: #d6d6d3;
      --floor-outer: #c4c4c0;
      --ceiling-inner: #ffffff;
      --ceiling-outer: #ececea;
      --ink: #111110;
      --dim: #686865;
      --line: rgba(17, 17, 16, 0.14);
      --veil: rgba(242, 242, 240, 0.82);
      --placard-bg: rgba(255, 255, 255, 0.94);
      --frame-shadow: 0 22px 44px rgba(17, 17, 16, 0.22), 0 4px 12px rgba(17, 17, 16, 0.12);
      --font-display: "Oswald", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Newsreader", Georgia, "Times New Roman", serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --edge: clamp(0.9rem, 2vw, 1.6rem);
      --bar-h: 3.6rem;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0d;
        --wall: #161615;
        --wall-spot: #282825;
        --floor-inner: #141413;
        --floor-mid: #0e0e0d;
        --floor-outer: #070706;
        --ceiling-inner: #1f1f1d;
        --ceiling-outer: #111110;
        --ink: #f5f5f3;
        --dim: #8a8a83;
        --line: rgba(245, 245, 243, 0.16);
        --veil: rgba(14, 14, 13, 0.82);
        --placard-bg: rgba(28, 28, 26, 0.94);
        --frame-shadow: 0 24px 50px rgba(0, 0, 0, 0.68), 0 6px 16px rgba(0, 0, 0, 0.48);
        color-scheme: dark;
      }
    }

    /* Manual theme override */
    body:has(#theme-toggle:checked) {
      --bg: #0e0e0d;
      --wall: #161615;
      --wall-spot: #282825;
      --floor-inner: #141413;
      --floor-mid: #0e0e0d;
      --floor-outer: #070706;
      --ceiling-inner: #1f1f1d;
      --ceiling-outer: #111110;
      --ink: #f5f5f3;
      --dim: #8a8a83;
      --line: rgba(245, 245, 243, 0.16);
      --veil: rgba(14, 14, 13, 0.82);
      --placard-bg: rgba(28, 28, 26, 0.94);
      --frame-shadow: 0 24px 50px rgba(0, 0, 0, 0.68), 0 6px 16px rgba(0, 0, 0, 0.48);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      body:has(#theme-toggle:checked) {
        --bg: #f2f2f0;
        --wall: #eeeeec;
        --wall-spot: #ffffff;
        --floor-inner: #e2e2e0;
        --floor-mid: #d6d6d3;
        --floor-outer: #c4c4c0;
        --ceiling-inner: #ffffff;
        --ceiling-outer: #ececea;
        --ink: #111110;
        --dim: #686865;
        --line: rgba(17, 17, 16, 0.14);
        --veil: rgba(242, 242, 240, 0.82);
        --placard-bg: rgba(255, 255, 255, 0.94);
        --frame-shadow: 0 22px 44px rgba(17, 17, 16, 0.22), 0 4px 12px rgba(17, 17, 16, 0.12);
        color-scheme: light;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    .sr-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* =========================================================
       TOP NAVIGATION BAR
       ========================================================= */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--bar-h);
      padding: 0 var(--edge);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: var(--veil);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 30;
    }

    .top-bar__left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 1.15rem;
    }

    .top-nav a {
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    .top-nav a:hover,
    .top-nav a[aria-current="page"] {
      color: var(--ink);
    }

    .chrome-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      height: 30px;
      padding: 0 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.18s ease;
    }

    .chrome-pill:hover {
      border-color: var(--ink);
    }

    .chrome-pill svg {
      width: 14px;
      height: 14px;
    }

    .icon-sun { display: none; }
    .icon-moon { display: block; }
    @media (prefers-color-scheme: dark) {
      .icon-sun { display: block; }
      .icon-moon { display: none; }
    }
    body:has(#theme-toggle:checked) .icon-sun { display: block; }
    body:has(#theme-toggle:checked) .icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      body:has(#theme-toggle:checked) .icon-sun { display: none; }
      body:has(#theme-toggle:checked) .icon-moon { display: block; }
    }

    /* =========================================================
       GALLERY / LIST VIEW SWITCH
       ========================================================= */
    .view-switches {
      position: fixed;
      top: calc(var(--bar-h) + 0.75rem);
      right: var(--edge);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--veil);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .view-switches label {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      color: var(--dim);
      cursor: pointer;
      user-select: none;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    body:not(:has(#view-list:checked)) .view-switches label[for="view-gallery"],
    body:has(#view-list:checked) .view-switches label[for="view-list"] {
      background: var(--ink);
      color: var(--bg);
    }

    /* =========================================================
       3D ARCHITECTURAL MUSEUM CORRIDOR
       ========================================================= */
    .gallery-scene {
      position: fixed;
      inset: 0;
      top: var(--bar-h);
      overflow: hidden;
      background: var(--bg);
      transition: opacity 0.3s ease;
    }

    .gallery-viewport {
      position: absolute;
      inset: 0;
      perspective: 680px;
      perspective-origin: 42% 48%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .gallery-world {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      /* Camera stands inside the curved corridor, offset slightly right so the left wall hugs closer */
      transform: translateX(110px) translateY(20px) translateZ(340px);
    }

    /* Physical 3D Curved Museum Floor & Ceiling Discs */
    .gallery-floor-disc,
    .gallery-ceiling-disc {
      position: absolute;
      left: 0;
      top: 0;
      width: 1760px;
      height: 1760px;
      border-radius: 50%;
      pointer-events: none;
    }

    .gallery-floor-disc {
      transform: translate(-50%, -50%) translateY(250px) rotateX(90deg);
      background: radial-gradient(
        circle at 50% 50%,
        var(--floor-inner) 0%,
        var(--floor-mid) 56%,
        var(--floor-outer) 92%,
        var(--floor-outer) 100%
      );
    }

    .gallery-ceiling-disc {
      transform: translate(-50%, -50%) translateY(-270px) rotateX(90deg);
      background: radial-gradient(
        circle at 50% 50%,
        var(--ceiling-inner) 0%,
        var(--ceiling-outer) 78%,
        var(--wall) 100%
      );
    }

    /* Rotating 3D Wall Cylinder (16 solid seamless bays = 22.5deg each) */
    .gallery-cylinder {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      animation: gallery-walk 64s linear infinite;
      will-change: transform;
    }

    .gallery-viewport:hover .gallery-cylinder,
    body:has(.inspect-radio:checked) .gallery-cylinder {
      animation-play-state: paused;
    }

    /* Solid curved wall segment with overhead museum spotlight */
    .gallery-bay {
      position: absolute;
      left: 0;
      top: 0;
      width: 344px;
      height: 540px;
      margin-left: -172px;
      margin-top: -270px;
      transform-style: preserve-3d;
      transform: rotateY(var(--bay-angle)) translateZ(-850px);
      background:
        radial-gradient(ellipse 64% 68% at 50% 44%, var(--wall-spot) 0%, var(--wall-spot) 34%, var(--wall) 78%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      cursor: pointer;
    }

    .gallery-frame {
      position: relative;
      width: 132px;
      height: 278px;
      background: #1b1b1d;
      border: 4px solid #1b1b1d;
      border-radius: 16px;
      box-shadow: var(--frame-shadow);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gallery-bay:hover .gallery-frame {
      transform: scale(1.04) translateZ(14px);
    }

    .gallery-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      border-radius: 12px;
    }

    /* Museum wall placard below artwork */
    .gallery-placard {
      margin-top: 12px;
      padding: 5px 9px;
      min-width: 108px;
      background: var(--placard-bg);
      border: 1px solid var(--line);
      text-align: left;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .gallery-placard__artist {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.2;
    }

    .gallery-placard__title {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.64rem;
      color: var(--dim);
      line-height: 1.25;
    }

    .gallery-placard__series {
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 0.48rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @keyframes gallery-walk {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-360deg); }
    }

    /* =========================================================
       STEP-IN INSPECTION MODAL (Pure CSS via .inspect-radio)
       ========================================================= */
    .inspect-backdrop {
      position: fixed;
      inset: 0;
      top: var(--bar-h);
      background: var(--veil);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 28;
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.28s ease;
      cursor: pointer;
    }

    .inspect-card {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
      pointer-events: none;
      animation: inspect-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .inspect-card__frame {
      width: min(260px, 68vw);
      aspect-ratio: 1320 / 2868;
      background: #1b1b1d;
      border: 5px solid #1b1b1d;
      border-radius: 26px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.32);
      overflow: hidden;
    }

    .inspect-card__frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 21px;
      display: block;
    }

    .inspect-card__meta {
      text-align: center;
    }

    .inspect-card__meta strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .inspect-card__meta span {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @keyframes inspect-in {
      0% { opacity: 0; transform: scale(0.92) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    body:has(.inspect-radio:checked) .inspect-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    body:has(#inspect-1:checked) .inspect-card[data-id="1"],
    body:has(#inspect-2:checked) .inspect-card[data-id="2"],
    body:has(#inspect-3:checked) .inspect-card[data-id="3"],
    body:has(#inspect-4:checked) .inspect-card[data-id="4"],
    body:has(#inspect-5:checked) .inspect-card[data-id="5"],
    body:has(#inspect-6:checked) .inspect-card[data-id="6"],
    body:has(#inspect-7:checked) .inspect-card[data-id="7"],
    body:has(#inspect-8:checked) .inspect-card[data-id="8"],
    body:has(#inspect-9:checked) .inspect-card[data-id="9"] {
      display: flex;
    }

    /* =========================================================
       BOTTOM HUD
       ========================================================= */
    .hud-center {
      position: fixed;
      left: 50%;
      bottom: clamp(1.3rem, 3vh, 2.2rem);
      transform: translateX(-50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
    }

    .hud-center__kicker {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 0.3rem;
    }

    .hud-center__title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .hud-center__cta {
      pointer-events: auto;
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }

    .hud-right {
      position: fixed;
      right: var(--edge);
      bottom: clamp(1.2rem, 2.8vh, 2rem);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
    }

    .hud-arrows {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .hud-arrow {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--veil);
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink);
    }

    .hud-hint {
      font-family: var(--font-mono);
      font-size: 0.5625rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: right;
      line-height: 1.6;
    }

    /* =========================================================
       LIST VIEW MODE
       ========================================================= */
    .list-view {
      position: fixed;
      inset: 0;
      top: var(--bar-h);
      overflow-y: auto;
      padding: 4.5rem var(--edge) 4rem;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.28s ease;
    }

    body:has(#view-list:checked) .list-view {
      opacity: 1;
      pointer-events: auto;
    }

    body:has(#view-list:checked) .gallery-scene {
      opacity: 0;
      pointer-events: none;
    }

    .list-grid {
      max-width: 72rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2.2rem 1.5rem;
    }

    .list-item {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      cursor: pointer;
    }

    .list-item__frame {
      aspect-ratio: 1320 / 2868;
      border-radius: 16px;
      background: #1b1b1d;
      border: 4px solid #1b1b1d;
      overflow: hidden;
      box-shadow: var(--frame-shadow);
    }

    .list-item__frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }

    .list-item__meta strong {
      display: block;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--ink);
    }

    .list-item__meta span {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-cylinder {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <input type="checkbox" id="theme-toggle" class="sr-input" aria-label="Toggle dark and light mode" />
  <input type="radio" name="gallery-view" id="view-gallery" class="sr-input" checked />
  <input type="radio" name="gallery-view" id="view-list" class="sr-input" />

  <!-- Pure-CSS Step-In Inspection Radios -->
  <input type="radio" name="inspect-art" id="inspect-none" class="sr-input" checked />
  <input type="radio" name="inspect-art" id="inspect-1" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-2" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-3" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-4" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-5" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-6" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-7" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-8" class="sr-input inspect-radio" />
  <input type="radio" name="inspect-art" id="inspect-9" class="sr-input inspect-radio" />

  <!-- Top Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar__left">
      <a href="gallery.html" class="brand-mark">Srikanandiraju</a>
      <nav class="top-nav" aria-label="Main">
        <a href="index.html">Orbit</a>
        <a href="drops.html">Drops</a>
        <a href="horizontals.html">Horizontals</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
      </nav>
    </div>

    <div class="top-bar__right">
      <label for="theme-toggle" class="chrome-pill" title="Toggle light/dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
